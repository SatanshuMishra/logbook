name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      - name: Run the rebuild test suite and assert a non-zero pass floor
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -euo pipefail
          npm test | tee test-output.tap
          pass_count=$(grep -oE '^# pass [0-9]+' test-output.tap | tail -n 1 | grep -oE '[0-9]+$')
          if [ -z "$pass_count" ] || [ "$pass_count" -eq 0 ]; then
            echo "the test run reported zero passing tests, the configured globs may have matched nothing"
            exit 1
          fi
          echo "the test run passed $pass_count tests"

  inspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run inspect:cli

  seeded-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Assert a seeded one-token mutant is caught by the unit layer
        run: |
          set -euo pipefail
          TARGET_FILE="src/render/escape.ts"
          MUTATION_TARGET='char !== ORDINARY_SPACE'
          MUTATION_REPLACEMENT='char === ORDINARY_SPACE'

          git diff --exit-code -- "$TARGET_FILE"

          set +e
          node --test "test/unit/**/*.test.ts"
          baseline_status=$?
          set -e

          if [ "$baseline_status" -ne 0 ]; then
            echo "the seeded-mutation gate cannot run against an already-red suite, unit layer baseline exited $baseline_status before any mutant was applied"
            exit 1
          fi

          set +e
          occurrence_count=$(grep -o -F -- "$MUTATION_TARGET" "$TARGET_FILE" | wc -l | tr -d ' ')
          set -e
          if [ "$occurrence_count" -ne 1 ]; then
            echo "expected exactly one occurrence of '$MUTATION_TARGET' in $TARGET_FILE to seed the mutant, found $occurrence_count, the gate's target has moved and the gate needs updating"
            exit 1
          fi

          sed -e "s/${MUTATION_TARGET}/${MUTATION_REPLACEMENT}/" "$TARGET_FILE" > "$TARGET_FILE.mutant"
          mv "$TARGET_FILE.mutant" "$TARGET_FILE"
          grep -n -F -- "$MUTATION_REPLACEMENT" "$TARGET_FILE"

          set +e
          node --test "test/unit/**/*.test.ts"
          mutant_status=$?
          set -e

          git checkout -- "$TARGET_FILE"
          git diff --exit-code -- "$TARGET_FILE"

          if [ "$mutant_status" -eq 0 ]; then
            echo "seeded mutant in $TARGET_FILE was not caught by the unit layer, the mutation gate proved nothing"
            exit 1
          fi

          echo "seeded mutant in $TARGET_FILE reddened the unit layer as expected, exit code $mutant_status"
